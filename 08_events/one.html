<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html Events</title>
</head>
<body style="background-color: #414141; color : aliceblue">
    <h3>Amazing Images</h3>
    <div>
    <ul id="images">
     <li><img width="200px" id="photoshop" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqisrIql2S90uq60YRzn1Khaf6Lyphr9bsvFHayyO5VA&s=10" alt="photoshop"></li>
     <li><img width="200px" id="nature" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRaubwPPBEJTrMAF6UayR_CUHZJLJx8SbTq53QjUmLhqg&s=10" alt=""></li>
     <li><a style="color: aliceblue;" href="https://google.com">Google</a></li>
     </ul>
     </div>
</body>
<script>
    document.getElementById('images ').addEventListener('click',function(e){
        console.log("clicked inside the images");
    },false)
    document.getElementById('nature').addEventListener('click',function(e){
        console.log("clicked inside the nature");
    },false)
</script>
</html>
